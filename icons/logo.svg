<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E5EA"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#logoBg)"/>
    
    <!-- Open Terminal / Brackets & Spark Symbol -->
    <path d="M26 28 L40 40 L26 52" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="44" y1="52" x2="56" y2="52" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="30" r="3.5" fill="#30D158"/>
  </g>

  <!-- Typography -->
  <text x="106" y="55" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Open<tspan fill="#0A84FF">Mac</tspan>
  </text>
  <text x="108" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#8E8E93" letter-spacing="0.2">
    OPEN-SOURCE MACOS DIRECTORY
  </text>
</svg>

